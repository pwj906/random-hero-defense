<style>
/* Layout: tactical console — map board left, command rail right; stacks on phones. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#243D83; --panel:#304B91; --panel2:#3F62BC; --line:#718ED2; --fg:#F7FAFF; --muted:#BDCFF7;
  --ore:#ffc23a; --gas:#4ef0b0; --life:#ff6b81; --hot:#ffc23a;
  --g0:#aab7c0; --g1:#428dff; --g2:#9b4dff; --g3:#ff573d; --g4:#ffd34f;
  --road:#141e24; --plate:#1d2c33;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(180deg,#4169BC,#243D83) fixed;color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ore);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.hud{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;line-height:1;margin-right:auto;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wavebox{display:flex;flex-direction:column;line-height:1.1}
.wavebox b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em}
.wavebox b span{font-family:var(--mono);font-weight:700;font-size:20px}
.wavebox small{font-size:13px;color:var(--muted)} .wavebox small #sTimer{color:#fff;font-family:var(--mono);font-weight:700}
.res{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border-radius:999px;padding:5px 12px 5px 6px;min-width:0}
.res svg{width:24px;height:24px;flex:none}
.res b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.res.life svg{fill:var(--life)} .res.ore svg{fill:var(--ore)} .res.ore svg .in{fill:none;stroke:#b07400;stroke-width:2} .res.gas svg{fill:var(--gas)}
.speed{display:flex;gap:6px}
.speed button{width:46px;height:42px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.speed #spX{background:var(--ore);color:#3a2300;border-color:var(--ore);width:54px}
.speed #spP[aria-pressed="true"]{background:var(--life);border-color:var(--life)}
.board{min-width:0}
.stage{position:relative}
.board canvas{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:var(--bg);touch-action:manipulation}
.banner{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:4;font-family:var(--display);font-weight:900;font-size:clamp(36px,9vw,58px);letter-spacing:.02em;-webkit-text-stroke:2px #182152;paint-order:stroke fill;text-shadow:0 5px 0 #182152,0 0 24px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s}
.banner.show{opacity:1}
.log{margin-top:8px;height:96px;overflow:auto;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.log p{margin:0 0 2px} .log p.hi{color:var(--fg)} .log p.warn{color:var(--life)} .log p.good{color:var(--gas)}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500;text-transform:uppercase}
.tabs{display:flex;gap:2px;margin:-4px -4px 10px;flex-wrap:wrap}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:6px 4px;font-size:12px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ore)}
.tabs button .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--ore);color:#1b1206;font-size:10px;font-family:var(--mono);margin-left:3px}
.sel{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.sel img{width:64px;height:64px;image-rendering:auto}
.grade{font-size:11px;font-weight:700;letter-spacing:.08em}
.tname{font-family:var(--display);font-size:20px;line-height:1.1}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0 0;font-size:12px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;background:linear-gradient(#638DF0,#3F62BC);border:1.5px solid #8DAAF0;border-radius:12px;box-shadow:0 3px 0 #253F87;color:#fff;font-weight:700;padding:8px 10px;font-weight:500;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--ore);color:#1b1206;border-color:var(--ore)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin:0}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
.row .lv{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.row small{display:block;color:var(--muted);font-size:11px}
.row .btn{flex:none;padding:5px 9px;font-size:12px;font-family:var(--mono)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick button img{width:40px;height:40px}
.ach{font-size:12px;display:flex;flex-direction:column;gap:3px}
.ach div{display:flex;gap:6px;color:var(--muted)} .ach div.done{color:var(--gas)}
.ach div::before{content:"○";width:12px} .ach div.done::before{content:"●"}
.codex{display:block}
.codex img{width:100%;aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--panel2);cursor:pointer}
.codex img.own{outline:1px solid var(--muted)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,28,66,.72);border-radius:14px;padding:16px}
.overlay .box{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;max-height:100%;overflow:auto}
.overlay h2{font-family:var(--display);font-size:30px;margin:0 0 4px;line-height:1.1;text-wrap:balance}
.overlay p{margin:0 0 10px;color:var(--muted);font-size:13px}
.diff{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
.diff button{text-align:center!important;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:left}
.diff button b{display:block;font-family:var(--display);font-size:18px;font-weight:400}
.diff button span{font-size:11px;color:var(--muted);display:block}
.diff button:hover{border-color:var(--ore)}
.mnav,.sheetHead{display:none}
.bubble{position:absolute;z-index:7;width:min(260px,82vw);background:#fff;color:#1b2550;border-radius:16px;padding:10px 12px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bubble .bh{display:flex;align-items:center;gap:6px}
.bubble .bh b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.bubble p{margin:4px 0 10px;font-size:13px;color:#4a5584}
.bubble .bb{display:flex;gap:6px}
.bubble .btn{padding:9px 6px;font-size:14px;background:#e9edfb;color:#1b2550;border-color:#d4daf3}
.bubble .btn.primary{background:var(--ore);border-color:var(--ore);color:#3a2300;font-weight:700}
.bubble .btn:disabled{background:#eef0f7;color:#8b93b8;border-color:#e2e5f1;box-shadow:none;opacity:1;font-weight:500}
.gchip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#14183a;white-space:nowrap}
.desc{margin:8px 0 0;font-size:13px}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:8px 4px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--panel2);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.row.up{grid-template-columns:1fr auto auto}
.row.up .un{display:block;font-size:14px}
.row.up .ui{display:flex;gap:2px;margin-top:3px;min-height:26px;align-items:center}
.row.up .ui img{width:26px;height:26px}
.row.up.dim{opacity:.55}
.btn.gem{display:flex;align-items:center;justify-content:center;gap:4px;min-width:74px;font-family:var(--mono);font-weight:700}
.btn.gem svg{width:16px;height:16px;fill:var(--gas)}
.crow{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.glab{font-size:12px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.ci{position:relative;padding:0;border:0;border-radius:8px;background:rgba(0,0,0,.2);aspect-ratio:1;box-shadow:inset 0 -3px 0 var(--gc)}
.ci img{width:100%;height:100%;display:block}
body:not(.atHome) .ci img{opacity:.45}body:not(.atHome) .ci.own img{opacity:1}
.ci .cn{display:none}
.cxDet{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,20,50,.6)}
.cxDet[hidden]{display:none}
.cxCard{position:relative;width:min(360px,100%);background:linear-gradient(#34509e,#25397a);border:3px solid var(--gc);border-radius:18px;padding:18px 16px 14px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.cxX{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
.cxTop{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.cxImg{flex:none;width:96px;height:96px;border-radius:14px;background:rgba(0,0,0,.25);box-shadow:inset 0 -4px 0 var(--gc)}
.cxImg img{width:100%;height:100%}
.cxCard h3{margin:6px 0 2px;font-size:22px;line-height:1.15}
.cxTags{margin:0;font-size:13px;color:#cfdcff}
.cxDesc{margin:0 0 12px;font-size:15px;line-height:1.45}
.cxKv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0}
.cxKv div{background:rgba(0,0,0,.22);border-radius:10px;padding:8px 10px}
.cxKv dt{font-size:12px;color:#b9c8f0}.cxKv dd{margin:2px 0 0;font-size:18px;font-weight:800}
.cxNote{margin:10px 0 0;font-size:11.5px;color:#b9c8f0}
@media (max-width:700px){
 #codex .crow{grid-template-columns:1fr;gap:4px;margin-bottom:12px}
 #codex .glab{font-size:14px}
 #codex .cgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 #codex .ci{aspect-ratio:auto;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center}
 #codex .ci img{width:72%;height:auto;aspect-ratio:1}
 #codex .ci .cn{display:block;margin-top:2px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
.ci .cnt{position:absolute;right:-3px;top:-4px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--gas);color:#0b3324;font:700 10px/16px var(--mono)}
.ci .cnt:empty{display:none}
.mlotto{display:none}
#startOv{background:radial-gradient(circle at 50% 30%,rgba(90,120,230,.85),rgba(28,38,88,.94));}
.start{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:420px;width:100%}
.logo{font-family:var(--display);font-size:clamp(40px,11vw,60px);line-height:1.02;color:#fff;letter-spacing:.01em;text-shadow:0 4px 0 #1a2350,0 0 24px rgba(255,194,58,.45);margin:0}
.logo span{display:block;color:var(--ore)}
.tag{margin:0;font-size:15px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.steps li{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:1.3}
.steps svg{width:30px;height:30px;fill:none;stroke:var(--ore);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go{width:100%;background:var(--ore);color:#3a2300;border:0;border-radius:16px;padding:16px;font-family:var(--display);font-size:26px;box-shadow:0 5px 0 #c27f00;touch-action:manipulation}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c27f00}
.lotto{position:absolute;right:12px;bottom:12px;z-index:5;width:76px;height:76px;border-radius:50%;border:2px solid var(--ore);background:radial-gradient(circle at 35% 30%,#3a2c12,#1b1408);color:var(--ore);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 6px 18px rgba(0,0,0,.6);touch-action:manipulation}
.lotto b{font-family:var(--display);font-size:20px;font-weight:400;line-height:1}
.lotto span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.lotto:disabled{opacity:.45}
.lotto:active{transform:scale(.94)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92%}
.toast p{margin:0;background:rgba(10,16,20,.92);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;animation:toast 2.4s ease forwards}
.toast p.good{color:var(--gas)} .toast p.warn{color:var(--life)} .toast p.hi{color:var(--ore)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reward button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.reward button b{font-size:18px;color:var(--fg);font-family:var(--display);font-weight:400}
.reward button:hover{border-color:var(--ore)}
@media (max-width:700px){
 body{padding-block:6px;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px));touch-action:manipulation;overscroll-behavior-y:none}

function inRange(t,tw,m){return inSquare(rtOf(t),m.x-tw.x,m.y-tw.y,monR(m)*.5)}
function damage(m,raw,dt){

}

}

    if(noFx)ANIM.lineFx(tw,t,ex,ey);else S.fx.push({k:"spine",x:tw.x,y:tw.y,x2:ex,y2:ey,c:col,life:10,max:10});return;
  }

// aura buffs: every magic character's buff adds up (two apprentice mages = +24%), capped at +100% per kind;
// magic upgrades make each buff 5%/level stronger

  for(const a of S.towers){const t=TOWERS[a.type];if(!t.aura)continue;const k=1+.05*(lvl(t)-3);

    let m=tw.target;if(!m||m.dead||!inRange(t,tw,m)){m=null;let best=-1;for(const o of S.mons){if(!o.dead&&o.d>best&&inRange(t,tw,o)){best=o.d;m=o}}tw.target=m}

    if(tw.atk!=null){tw.atk++;if(!tw.fired&&tw.atk>=tw.relAt){tw.fired=true;ANIM.release(tw,t)}if(tw.atk>=tw.atkDur)tw.atk=null}
    if(tw.cool>0){tw.cool--;continue}
    if(m){sfx("atk_"+(ROLE[t.uid]||"Shot"));if(ANIM.has(t)){tw.cool=t.cd/(tw.bSpd||1);tw.atkDur=Math.min(7.2,tw.cool);tw.relAt=tw.atkDur*3.5/6;tw.atk=0;tw.fired=false;tw.pend=m}else{fire(tw,t,m);tw.cool=t.cd/(tw.bSpd||1);tw.kick=4}}

}

  return `<div class="oddsH">보급상자 <small>웨이브가 끝날 때마다 ${Math.round(crateP()*100)}% 확률로 열림${has("supply_vip")?" · 증강 적용":""}</small></div><table class="odds">${pool.map(o=>`<tr class="${["hero","legend","frenzy"].includes(o.k)?"hero":""}"><td>${CRATE_NAME[o.k]}</td><td>${pc(o.w)}</td></tr>`).join("")}</table>`}
// called when a wave is cleared (and twice by the airdrop augment)
function crateTry(force){if(S.cA&&S.cA.t<C_TEASE+C_OPEN){S.crateQ=(S.crateQ||0)+(force?1:0);return}
  S.cA={t:0,win:force||Math.random()<crateP()};sfx("reel");crateState("tease")}
function crateTick(){
  if(S.cBuff>0)S.cBuff--;
  const A=S.cA;if(!A){if(S.crateQ>0){S.crateQ--;crateTry(true)}return}
  A.t++;if(A.t%5===0&&A.t<C_TEASE)sfx("tick");
  if(A.t===C_TEASE){if(!A.win){sfx("miss");crateState("","fail");S.cA=null;return}
    sfx("jackpot");crateState("open");setTimeout(()=>{if(S.cA)crateState("opened")},620);log("보급상자가 열렸어요!","good")}
  if(A.win&&A.t===C_TEASE+14)crateOpen();
  if(A.t>=C_TEASE+C_OPEN){S.cA=null;setTimeout(()=>{if(!S.cA)crateState("")},2500)}}
let crateInfoHide=0;
function crateOpen(){
  const pool=cratePool(),tot=pool.reduce((a,o)=>a+o.w,0);let r=Math.random()*tot,o=pool[0];for(const q of pool){if((r-=q.w)<0){o=q;break}}
  if(window.FAST_LOTTO){crateGive(o);return}
  crateWheel(o.k,()=>crateGive(o))}
function crateGive(o){
  const w=S.wi+1,vip=has("supply_vip")?2:1,pr={k:o.k};let txt,rare=false;
  if(o.k==="gold"){pr.v=(200+15*w)*vip;S.ore+=pr.v;txt=`골드 +${pr.v}`}
  else if(o.k==="gem"){pr.v=(100+5*w)*vip;S.gas+=pr.v;txt=`보석 +${pr.v}`}
  else if(o.k==="tix"){S.freeTix=(S.freeTix||0)+3;txt="무료 복권 3장"}
  else if(o.k==="frenzy"){S.cBuff=24*20;applyAuras();txt="광폭! 20초간 공격력·공속 1.5배";rare=true}
  else if(o.k==="upg"){for(const k in S.upg)if(S.upg[k]<255)S.upg[k]++;txt="모든 업글 +1";rare=true}
  else{const g={elite:2,hero:3,legend:4}[o.k];pr.type=pick(byGrade(g)).i;placePrize(pr.type);txt=`${GRADE[g]} ${TOWERS[pr.type].name}`;rare=g>=3}
  log(`보급상자: ${txt}`,"good");if(rare)banner(o.k==="legend"?"보급 대박! 전설":"보급 대박!",o.k==="legend"?GCOL[4]:GCOL[3]);
  if(!window.FAST_LOTTO){const el=$("crateInfo");if(el){el.querySelector("h4 span").textContent=txt;el.classList.add(rare?"jp":"won");sfx(rare?"jackpot":"win");
    if(o.k==="legend"){const f=document.createElement("div");f.className="miracleFx";document.body.appendChild(f);setTimeout(()=>f.remove(),1600)}
    clearTimeout(crateInfoHide);crateInfoHide=setTimeout(()=>el.classList.remove("show","jp","won"),rare?2600:1900)}}
  renderPanels()}
// roulette: the 8 prizes sit in a ring, the light runs around, slows down and stops on the prize
const CRATE_ICON=Object.fromEntries(Object.entries({gold:"gold",gem:"gem",tix:"ticket",elite:"elite",hero:"hero",frenzy:"frenzy",upg:"upgrade",legend:"legend"}).map(([k,f])=>[k,`<img alt="" src="${A(`ui/roulette/prize_${f}.webp`)}">`]));
const CRATE_SHORT={gold:"골드",gem:"보석",tix:"복권 3장",elite:"정예",hero:"영웅",frenzy:"광폭",upg:"업글 +1",legend:"전설"};
function crateWheel(k,done){
  let el=$("crateInfo");if(!el){el=document.createElement("div");el.id="crateInfo";el.className="crateInfo";document.body.appendChild(el)}
  el.onclick=null;clearTimeout(crateInfoHide);el.classList.remove("jp","won");
  const pool=cratePool(),tot=pool.reduce((a,o)=>a+o.w,0),RING=[0,1,2,3,7,6,5,4]; // grid 4x2, walk around the edge
  const col={elite:GCOL[2],hero:GCOL[3],legend:GCOL[4]};
  el.innerHTML=`<p class="ctop"><b>${Math.round(crateP()*100)}%</b> 확률로 보급상자가 열렸어요!</p><h4><span>보급상자</span></h4><div class="cw">${pool.map(o=>`<div class="cc ${o.k}"${col[o.k]?` style="--g:${col[o.k]}"`:""}><i>${CRATE_ICON[o.k]}</i><b>${CRATE_SHORT[o.k]}</b><small>${Math.round(o.w/tot*1000)/10}%</small></div>`).join("")}</div>`;
  el.className="crateInfo wheel show spin";const cells=[...el.querySelectorAll(".cc")],target=pool.findIndex(o=>o.k===k),tpos=RING.indexOf(target);
  let N=16+Math.floor(Math.random()*8);while(N%8!==tpos)N++;let i=0;
  const step=()=>{cells.forEach(c=>c.classList.remove("on"));cells[RING[i%8]].classList.add("on");sfx("tick");
    if(i>=N){el.classList.remove("spin");cells[target].classList.add("hit");setTimeout(done,350);return}
    i++;const left=N-i;setTimeout(step,left>10?55:left>5?95:left>2?170:left>0?280:0)};
  setTimeout(step,500)}
function drawCrate(){} // the crate is a page element under the board (outside the road and the hero slots)
function crateEl(){let el=$("crateBox");if(!el){el=document.createElement("div");el.id="crateBox";el.className="crateBox";el.innerHTML=`<i class="cg"></i><i class="cs" role="img" aria-label="보급상자"></i><i class="cfx"></i><i class="cpf"></i><b class="cb"></b><small class="cl"></small>`;document.querySelector(".stage").appendChild(el)}return el}
function cratePlace(){const el=crateEl(),l=el.querySelector(".cl");if(l)l.textContent=`열릴 확률 ${Math.round(crateP()*100)}%`}
addEventListener("resize",()=>setTimeout(cratePlace,50));
function crateState(st,txt){cratePlace();const el=crateEl();el.className="crateBox"+(st?" "+st:"");
  if(txt==="fail"){const pf=el.querySelector(".cpf");pf.classList.remove("go");void pf.offsetWidth;pf.classList.add("go");txt="아깝다!"}
  const b=el.querySelector(".cb");b.textContent=txt||"";if(txt){b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}}
setTimeout(cratePlace,60);

// ---------- sound: every effect and the music are synthesized with Web Audio (no audio files) ----------
const SND={ctx:null,master:null,sfx:null,music:null,on:true,last:{},recent:[],bgm:null};
try{SND.on=localStorage.getItem("rhd_sound")!=="off"}catch(e){}
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==="suspended")SND.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=SND.ctx=new AC();SND.master=c.createGain();SND.master.gain.value=SND.on?1:0;SND.master.connect(c.destination);
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;comp.connect(SND.master);
  SND.sfx=c.createGain();SND.sfx.gain.value=.42;SND.sfx.connect(comp);
  SND.music=c.createGain();SND.music.gain.value=.16;SND.music.connect(comp);
  const n=c.sampleRate*.5,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;SND.noise=b;
  bgmStart();
}
function setSound(on){SND.on=on;try{localStorage.setItem("rhd_sound",on?"on":"off")}catch(e){}if(SND.master)SND.master.gain.setTargetAtTime(on?1:0,SND.ctx.currentTime,.05);const b=$("sndBtn");if(b){b.setAttribute("aria-pressed",String(!on));b.setAttribute("aria-label",on?"소리 끄기":"소리 켜기")}}
// one synth voice: osc type, start freq -> end freq, length, volume
function tone(type,f0,f1,len,vol,at,dest){const c=SND.ctx,t=at||c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+len);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.012,len*.2));g.gain.exponentialRampToValueAtTime(0.0001,t+len);o.connect(g);g.connect(dest||SND.sfx);o.start(t);o.stop(t+len+.02)}
function noise(len,vol,fq,q,at,type,dest){const c=SND.ctx,t=at||c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=SND.noise;f.type=type||"bandpass";f.frequency.setValueAtTime(fq,t);f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);s.connect(f);f.connect(g);g.connect(dest||SND.sfx);s.start(t,Math.random()*.3);s.stop(t+len+.02)}
const notes=(base,steps,gap,type,len,vol)=>{const t=SND.ctx.currentTime;steps.forEach((s,i)=>tone(type,base*Math.pow(2,s/12),0,len,vol,t+i*gap))};
const SFX={
  build(){tone("square",520,880,.09,.12);tone("triangle",880,1320,.12,.08,SND.ctx.currentTime+.05)},
  rare(){notes(523,[0,4,7,12],.07,"square",.16,.1)},
  god(){notes(392,[0,4,7,12,16,19,24],.06,"square",.35,.09);noise(.9,.18,6000,.4,0,"highpass")},
  merge(){tone("sine",300,1200,.22,.22);tone("triangle",600,2400,.25,.08,SND.ctx.currentTime+.04)},
  atk_Melee(){noise(.07,.35,900,1.2);tone("triangle",180,90,.07,.18)},
  atk_Shot(){noise(.05,.28,2600,1.5);tone("square",900,300,.05,.05)},
  atk_Sniper(){noise(.12,.35,1800,.8);tone("sawtooth",1400,200,.1,.06)},
  boom(){noise(.28,.4,320,.7,0,"lowpass");tone("sine",110,45,.25,.25)},
  pop(){tone("sine",700+Math.random()*300,180,.07,.1)},
  hurt(){tone("sawtooth",220,110,.25,.18);tone("square",233,117,.25,.08)},
  wave(){noise(.35,.2,800,.5);tone("triangle",196,392,.3,.14)},
  boss(){const t=SND.ctx.currentTime;tone("sawtooth",98,98,.5,.2,t);tone("sawtooth",104,104,.5,.12,t);tone("sawtooth",73,73,.7,.2,t+.45);noise(.6,.25,200,.6,t,"lowpass")},
  clear(){notes(659,[0,4,7],.08,"triangle",.18,.14)},
  coin(){tone("square",988,988,.06,.08);tone("square",1319,1319,.14,.08,SND.ctx.currentTime+.06)},
  up(){notes(440,[0,5,9,12],.05,"square",.1,.08)},
  tick(){tone("square",1500,1500,.02,.04)},
  reel(){tone("triangle",420,260,.06,.12);noise(.04,.12,3000,2)},
  miss(){tone("triangle",392,196,.35,.14);tone("triangle",370,185,.35,.08,SND.ctx.currentTime+.05)},
  win(){notes(784,[0,4,7,12],.06,"square",.12,.08)},
  jackpot(){notes(523,[0,4,7,12,7,12,16,19,24],.07,"square",.2,.09);noise(1.2,.15,7000,.4,0,"highpass")},
  flip(){noise(.12,.18,2500,.8);tone("sine",500,900,.08,.05)},
  pick(){notes(660,[0,7,12],.06,"triangle",.22,.14)},
  frost(){notes(1760,[0,5,12],.035,"sine",.18,.06);noise(.2,.08,8000,1)},
  spike(){noise(.08,.3,1500,2);tone("square",300,120,.06,.08)},
  zap(){noise(.25,.35,3500,.4,0,"highpass");tone("sawtooth",1800,90,.22,.12)},
  over(){notes(392,[0,-2,-4,-7],.18,"triangle",.4,.15)},
};
// throttle: busy fights trigger hundreds of hits; keep it to a pleasant rate
const SFX_GAP={atk_Melee:.07,atk_Shot:.06,atk_Sniper:.09,boom:.1,pop:.05,frost:.12,spike:.08,zap:.15,reel:.05,tick:.03};
function sfx(name){
  if(!SND.ctx||!SND.on||!SFX[name])return;const now=SND.ctx.currentTime;
  if(SFX_GAP[name]){if(now-(SND.last[name]||0)<SFX_GAP[name]*(speed>2?1.6:1))return;SND.recent=SND.recent.filter(x=>now-x<.25);if(SND.recent.length>=6)return;SND.recent.push(now)}
  SND.last[name]=now;try{SFX[name]()}catch(e){}
}
// ---------- music: a small looping chiptune; calm for normal waves, faster minor key for bosses ----------
const SONGS={
  calm:{bpm:112,chords:[[0,4,7],[-5,-1,2],[-3,0,4],[-7,-3,0]],root:261.63,lead:[12,11,7,4, 9,7,4,2, 4,7,9,12, 11,7,14,12]},
  boss:{bpm:138,chords:[[0,3,7],[-4,0,3],[-2,2,5],[-5,-1,2]],root:220,lead:[12,15,12,10, 8,7,8,10, 12,15,19,17, 15,14,12,11]},
};
function bgmStart(){if(SND.bgm)return;SND.bgm={song:"calm",step:0,next:SND.ctx.currentTime+.1};setInterval(bgmPump,40)}
function bgmMode(m){if(SND.bgm&&SONGS[m])SND.bgm.song=m}
function bgmPump(){
  const B=SND.bgm,c=SND.ctx;if(!B||!c||c.state!=="running")return;
  const quiet=!running||paused||document.hidden;
  while(B.next<c.currentTime+.15){
    const s=SONGS[B.song],q=60/s.bpm/2,st=B.step%64,bar=Math.floor(st/16)%4,ch=s.chords[bar],t=B.next;
    if(!quiet){const fr=k=>s.root*Math.pow(2,k/12);
      if(st%4===0)tone("triangle",fr(ch[0]-12),0,q*3.6,.5,t,SND.music);
      tone("square",fr(ch[st%3]+(st%8>3?12:0)),0,q*.8,.12,t,SND.music);
      if(st%2===0){const ln=s.lead[(st/2)%16];if(ln!=null&&(B.song==="boss"||st%8!==6))tone("square",fr(ln),0,q*1.6,.13,t,SND.music)}
      if(st%8===0)noise(.12,.5,120,.8,t,"lowpass",SND.music);
      if(st%8===4)noise(.1,.35,1800,.7,t,"bandpass",SND.music);
      if(B.song==="boss"&&st%2===1)noise(.03,.18,7000,1,t,"highpass",SND.music)}
    B.step++;B.next+=q}
}
// speaker toggle in the corner of the board
(function(){const b=document.createElement("button");b.type="button";b.id="sndBtn";b.className="sndBtn";
  b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  b.onclick=()=>{audioInit();setSound(!SND.on)};document.querySelector(".stage").appendChild(b);setSound(SND.on)})();
// browsers only allow sound after a tap: unlock on the first one
addEventListener("pointerdown",audioInit,{once:false,passive:true});

// ---------- home screen and result screen ----------
function bestWave(){try{return +localStorage.getItem("rhd_best")||0}catch(e){return 0}}
function showHome(){
  $("startOv").hidden=false;document.body.classList.add("atHome");const b=bestWave();
  $("homeBest").textContent=b?`최고 기록 ${b} 웨이브`:"아직 기록이 없어요";homeSndSync();
}
function homeSndSync(){const on=SND.on;$("homeSndImg").src=`ui/home/btn_sound_${on?"on":"off"}.png`;$("homeSnd").setAttribute("aria-label",on?"소리 끄기":"소리 켜기")}
$("homeSnd").onclick=()=>{audioInit();setSound(!SND.on);homeSndSync()};
$("homeHelp").onclick=()=>{$("helpModal").hidden=false};
$("homeCodex").onclick=()=>{$("codexSlot").appendChild($("codex"));$("codexModal").hidden=false};
document.querySelectorAll(".homeModal [data-close]").forEach(b=>b.onclick=()=>{const m=b.closest(".homeModal");m.hidden=true;if(m.id==="codexModal")$("codexCard").appendChild($("codex"))});
document.querySelectorAll(".homeModal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.querySelector("[data-close]").click()}));
function showResult(){
  const wave=S.wi+1,prev=bestWave(),isNew=wave>prev;if(isNew)try{localStorage.setItem("rhd_best",wave)}catch(e){}
  $("resBanner").src=`ui/result/banner_${isNew?"newrecord":"record"}.png`;$("resBanner").alt=isNew?"신기록!":"기록";
  $("resWave").textContent=wave;$("resBest").textContent=`최고 기록 ${Math.max(prev,wave)} 웨이브`;
  $("resAugs").innerHTML=S.aug.length?S.aug.map(id=>`<img alt="${AUG[id].name}" title="${AUG[id].name}" src="ui/aug/icons/${id}.png">`).join(""):`<small>고른 증강 없음</small>`;
  const top=[...S.towers].sort((a,b)=>TOWERS[b.type].grade-TOWERS[a.type].grade||(b.conc||0)-(a.conc||0))[0];
  $("resHero").innerHTML=top?`<img alt="${TOWERS[top.type].name}" src="${ICON[top.type]}"><small>${TOWERS[top.type].name}${top.conc?" ★"+(top.conc+1):""}</small>`:"";
}
showHome();

// ---------- dopamine: crits, kill coins, all-clear bonus, crisis warning and escape ----------
const CRIT_P=.08,CRIT_X=2.5;
let lastCrit=0,coinAcc=0,lastCoin=0;
function critFx(m,v){if(S.frame-lastCrit<4)return;lastCrit=S.frame;S.fx.push({k:"txt",t:fmt(v)+"!",x:m.x+(Math.random()-.5)*16,y:m.y-14,c:"#ffe14a",sc:"#8a2a00",big:true,life:22,max:22})}
