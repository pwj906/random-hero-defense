<style>
/* Layout: fixed 960x540 landscape stage, scaled (and rotated on portrait phones) — traits left, round tracker top, 7x8 hex board (enemy half above, mine below) + bench centre, info right, shop bar bottom */
:root{
  --ink:#0d1230; --navy:#141a40; --panel:rgba(16,22,56,.88); --panel2:#1f2858; --rule:#39437e;
  --brass:#d4b36a; --brassDim:#7d6a43;
  --text:#eef0ff; --muted:#a4aad8;
  --water:#4cc3ff; --elec:#ffd23f; --fire:#ff7a45; --sup:#7fe0c0; --foe:#c46ce2;
  --good:#5be3a1; --bad:#ff5d73; --gold:#ffcf5a;
  --c1:#9aa4b8; --c2:#3fbf7f; --c3:#4f8ef7; --c4:#b16cf0; --c5:#f0b43c;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
.app{height:100%;box-sizing:border-box;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
.wrap{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--navy);border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;width:960px;height:540px;touch-action:none}

.tracker{position:absolute;left:330px;top:6px;width:300px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.stages{display:flex;gap:3px;align-items:center}
.stages i{width:8px;height:8px;border-radius:50%;background:var(--panel2);border:2px solid var(--rule);display:block}
.stages i.done{background:var(--brassDim);border-color:var(--brassDim)}
.stages i.lost{background:var(--bad);border-color:var(--bad);opacity:.7}
.stages i.now{background:var(--brass);border-color:var(--text);transform:scale(1.3)}
.stages i.elite{border-radius:2px;transform:rotate(45deg)}
.stages i.elite.now{transform:rotate(45deg) scale(1.3)}
.stages i.boss{border-color:var(--bad)}
.phase{font-family:var(--display);font-size:15px;line-height:1;display:flex;gap:8px;align-items:baseline}
.phase small{font-family:var(--body);font-size:10.5px;color:var(--muted);font-weight:600}
.tbar{width:200px;height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden}
.tbar b{display:block;height:100%;background:var(--brass)}
.tbar.fight b{background:var(--bad)}

.traits{position:absolute;left:8px;top:8px;width:150px;max-height:424px;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.panelTitle{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--brass);padding-left:2px}
.trait{display:grid;grid-template-columns:22px 1fr;gap:5px;align-items:center;padding:2px 6px 2px 4px;border-radius:8px;background:var(--panel);border:1px solid transparent}
.trait .td{display:none;margin-top:2px}.trait.open .td{display:block}.trait{cursor:pointer}.trait .hx{width:19px;height:21px;font-size:10px}.trait.open{padding:4px 6px 5px 4px}.trait:hover{border-color:rgba(238,240,255,.25)}
.trait.on{border-color:var(--brassDim)}
.trait.off{opacity:.5}
.hx{width:28px;height:30px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--ink)}
.trait.off .hx{background:#3a4170!important;color:var(--muted)}
.trait .tn{font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;min-width:0}
.trait>div:last-child{min-width:0}.trait .td{overflow-wrap:anywhere}
.trait .tn b{font-variant-numeric:tabular-nums;color:var(--brass)}
.trait.off .tn b{color:var(--muted)}
.trait .td{font-size:10.5px;color:var(--muted);line-height:1.3}
.augs{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.aug{font-size:11px;padding:5px 8px;border-radius:7px;background:var(--panel);border:1px solid #6b5bd6;line-height:1.35}
.aug b{display:block;font-size:11.5px;color:#c7bdff}

.side{position:absolute;right:8px;top:8px;bottom:112px;overflow-y:auto;scrollbar-width:none;width:150px;display:flex;flex-direction:column;gap:8px}
.box{background:var(--panel);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.hpRow{display:flex;justify-content:space-between;align-items:baseline}
.hpRow b{font-family:var(--display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.hpRow span{font-size:11px;color:var(--muted);font-weight:600}
.hpbar{height:7px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:11.5px;color:var(--muted)}
.kv b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.kv4{grid-template-columns:auto 1fr auto 1fr;gap:3px 6px}
.kv4 b{text-align:left}
.kv i.up,.up{font-style:normal;color:#7cc4ff;font-weight:700}
.info .nm{font-family:var(--display);font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.info .el{font-size:11px;font-weight:700}
.effs{display:grid;gap:2px;font-size:10.5px;line-height:1.35;padding:5px 6px;border-radius:7px;background:rgba(0,0,0,.22)}.effs div{display:flex;gap:6px;align-items:baseline}.effs em{font-style:normal;font-weight:700;color:var(--brass);flex:none;min-width:38px}.effs span{color:var(--text)}
.info .match{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11px;color:var(--muted)}.info .match span{display:flex;flex-direction:column;line-height:1.25}.info .match b{font-weight:700;margin-right:3px}
.info .desc{font-size:11px;color:var(--muted);line-height:1.35}
.skl{display:grid;gap:3px;font-size:11px}
.skl div{display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.skl div.lock{color:var(--muted)}
.skl em{font-style:normal;font-size:10px;font-weight:700;color:var(--brass);flex:none;width:26px}
.cardsBar{height:5px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.cardsBar i{display:block;height:100%;background:var(--gold)}

.shopbar{position:absolute;left:0;right:0;bottom:0;height:107px;grid-template-rows:minmax(0,1fr);background:linear-gradient(180deg,rgba(13,18,48,.92),#0b0f29);border-top:2px solid var(--brassDim);display:grid;grid-template-columns:118px 1fr 104px;gap:8px;padding:7px 10px;box-sizing:border-box}
.lvl{display:flex;flex-direction:column;gap:6px;min-height:0}
.lvlBtns{display:grid;grid-template-columns:1fr;gap:6px;flex:1;min-height:0}
.lvlBtns .act{flex-direction:row;justify-content:space-between;padding:2px 8px;font-size:13px;line-height:1}
.lvlTop{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);font-weight:600}
.lvlTop b{font-family:var(--display);font-size:16px;font-weight:400;color:var(--text)}
.xp{height:5px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}
.xp i{display:block;height:100%;background:#6fb3ff}
.act{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:15px;border:1px solid var(--brassDim);border-radius:7px;padding:5px 8px;background:var(--panel2);color:var(--text);cursor:pointer}
.act span{font-family:var(--body);font-size:11px;font-weight:700;color:var(--gold)}
.act:disabled,.card:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:7px;max-width:520px;margin:0 auto;width:100%;min-height:0;height:100%}
.card{position:relative;min-width:0;min-height:0;height:100%;border-radius:8px;border:2px solid var(--c1);background-color:var(--panel2);background-image:var(--img);background-size:cover;background-position:center 20%;color:var(--text);cursor:pointer;padding:0;overflow:hidden;font-family:var(--body);text-align:left}
.card.c2{border-color:var(--c2)}.card.c3{border-color:var(--c3)}.card.c4{border-color:var(--c4)}.card.c5{border-color:var(--c5);box-shadow:0 0 10px rgba(240,180,60,.45)}
.card.c1 .cost{color:var(--c1)}.card.c2 .cost{color:var(--c2)}.card.c3 .cost{color:var(--c3)}.card.c4 .cost{color:var(--c4)}.card.c5 .cost{color:var(--c5)}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 7px;border-radius:7px;font-size:11px;font-weight:800;color:#0a0e1f;background:var(--cc);white-space:nowrap}.cbar span{font-weight:700;opacity:.85}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;background:linear-gradient(180deg,transparent,rgba(8,10,28,.94) 40%);display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.card .nm{font-family:var(--display);font-size:16px;line-height:1}
.card .tr{display:flex;gap:5px;flex-wrap:nowrap;margin-bottom:3px}
.card .tr span{display:flex;gap:3px;align-items:center;font-size:9.5px;font-weight:700;color:#d6d9f2;white-space:nowrap}
.card .ty{font-style:normal;font-family:var(--body);font-size:10px;font-weight:700;margin-left:6px;vertical-align:2px}
.card .tr i{width:9px;height:10px;display:inline-block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.card .cost{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:6px;background:rgba(8,10,28,.9);border:1.5px solid currentColor;font-family:var(--display);font-size:14px;color:var(--gold);line-height:1}
.card .rg{position:absolute;left:6px;top:30px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(8,10,28,.8);color:#9fe8e0}
.card .own{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(8,10,28,.85);color:var(--gold)}
.card.up{box-shadow:0 0 0 2px var(--gold) inset}
.card.sold{visibility:hidden}
.right{display:flex;flex-direction:column;gap:6px;min-height:0}
.ready{font-family:var(--display);font-size:16px;border:0;border-radius:8px;flex:1;min-height:0;background:var(--brass);color:#22190a;cursor:pointer}
.ready:disabled{opacity:.45;cursor:default}
.goldTip{position:absolute;left:50%;transform:translateX(-50%);bottom:124px;z-index:3;width:250px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--brassDim);font-size:11px;line-height:1.45;color:var(--text)}
.goldTip b{color:var(--gold)}.goldTip .row{display:flex;justify-content:space-between;gap:8px}.goldTip .row.now{color:var(--gold);font-weight:700}
.goldPill{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:2;cursor:pointer;display:flex;align-items:center;gap:8px;padding:2px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--brassDim)}
.goldPill b{font-family:var(--display);font-size:19px;font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.goldPill .coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8892a}
.goldPill small{font-size:10.5px;color:var(--muted);font-weight:600}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,28,.84)}
[hidden]{display:none!important}
.sheet{width:480px;display:flex;flex-direction:column;gap:14px}
.sheet h1,.sheet h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
.sheet h1{font-size:46px} .sheet h2{font-size:32px}
.sheet p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.rules{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.rules b{color:var(--text)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:5px}
.big{font-family:var(--display);font-size:21px;border:0;border-radius:10px;padding:11px 18px;background:var(--brass);color:#22190a;cursor:pointer}
.big.alt{background:var(--panel2);color:var(--text)}
.augPick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:640px}
.augC{display:flex;flex-direction:column;gap:8px;padding:16px 14px;border-radius:12px;border:2px solid #6b5bd6;background:linear-gradient(180deg,#2a2466,#17163d);color:var(--text);cursor:pointer;text-align:left;font-family:var(--body);min-height:150px}
.augC:hover{border-color:#c7bdff;transform:translateY(-3px)}
.augC b{font-family:var(--display);font-size:22px;font-weight:400;color:#e2dcff}
.augC span{font-size:13px;color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.lotto{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,28,.55);cursor:pointer}
.ticket{width:210px;padding:18px;border-radius:16px;background:var(--gold);color:#2a1d00;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 0 #b8892a}
.ticket .t1{font-size:12px;font-weight:700;letter-spacing:.1em}
.ticket .t2{font-family:var(--display);font-size:42px;line-height:1}
.ticket .t3{font-size:12.5px;font-weight:600}
.ticket.spin .t2{animation:spin .12s steps(2) infinite}
@keyframes spin{50%{opacity:.3;transform:translateY(-3px)}}
.ticket.win{animation:win .5s ease-out}
@keyframes win{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ticket.spin .t2,.ticket.win{animation:none}.augC:hover{transform:none}}
</style>
